name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Falls back to a placeholder origin when the repo variable isn't set
      # (e.g. on forks); set the real value under Settings > Secrets and
      # variables > Actions > Variables > SITE_URL.
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://example.com' }}
      # Build with the same base path deploy-pages.yml uses, so the build,
      # e2e suite (via serve-out.mjs) and Lighthouse all test the
      # configuration that actually ships to GitHub Pages.
      NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run validate:content

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (static export)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Lighthouse CI
        continue-on-error: true
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          npm run serve:out &
          npx --yes wait-on http://localhost:4173${BASE_PATH}/
          npx --yes @lhci/cli autorun \
            --collect.url="http://localhost:4173${BASE_PATH}/" \
            --collect.url="http://localhost:4173${BASE_PATH}/curriculum/" \
            --collect.url="http://localhost:4173${BASE_PATH}/lessons/before-you-start/what-is-value-investing/" \
            --collect.url="http://localhost:4173${BASE_PATH}/tools/dcf/" \
            --collect.url="http://localhost:4173${BASE_PATH}/progress/"
