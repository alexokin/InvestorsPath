name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      # Set the BASE_PATH repo variable to "/InvestorsPath" while serving
      # from the default Pages URL. Clear it (delete the variable, or set it
      # to an empty value) once a custom domain is mapped at the repo root -
      # see the comment near the bottom of this file.
      NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build

      # GitHub Pages ignores files/folders starting with "_" unless this
      # marker is present, so Next's _next/ asset directory would otherwise
      # be dropped from the deployed artifact.
      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# This repo currently deploys as a *project* Pages site
# (alexokin.github.io/InvestorsPath), a subpath rather than the domain root,
# so next.config.ts reads NEXT_PUBLIC_BASE_PATH (set above from the BASE_PATH
# repo variable) and applies basePath/assetPrefix only for this build - local
# dev, local builds, e2e and Lighthouse are never prefixed.
#
# When a custom domain is mapped (Settings -> Pages -> Custom domain, plus
# the DNS record it asks for), the site serves from the root instead:
#   1. Delete the BASE_PATH repo variable (or set it to an empty value).
#   2. Update the SITE_URL repo variable (and local .env.local) to the new
#      domain.
#   3. Re-run this workflow (push to main, or Actions -> Run workflow).
# No code change is needed for that switch - next.config.ts already treats
# an unset NEXT_PUBLIC_BASE_PATH as "no prefix".
